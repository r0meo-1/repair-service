version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/repair.db
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_HTTPS_ONLY=${SESSION_HTTPS_ONLY:-false}
    command: >-
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
