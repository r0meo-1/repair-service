{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<h2>New Repair Request</h2>
{% if success %}
<div class="alert alert-success">Request submitted successfully!</div>
{% endif %}
<form method="post">
  <div class="mb-3">
    <label class="form-label">Client Name</label>
    <input type="text" name="clientName" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Problem Description</label>
    <textarea name="problemText" class="form-control" rows="4" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Submit Request</button>
</form>
</div>
</div>
{% endblock %}
